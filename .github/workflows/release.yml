name: Home-Assistant-Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: BierAlarm ${{ github.ref_name }}
          make_latest: true
          body: Integration für Home Assistant. Installieren oder aktualisieren über HACS bzw. den Marketplace.

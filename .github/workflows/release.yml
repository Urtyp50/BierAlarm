name: Home-Assistant-Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: BierAlarm ${{ github.ref_name }}
          make_latest: true
          body: Integration für Home Assistant. Installieren oder aktualisieren über HACS bzw. den Marketplace.

name: Android-App

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pakete für python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade "buildozer==1.5.0" "cython<3.1" setuptools

      - name: Leser aus der Integration übernehmen
        run: python android/sync_core.py

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}

      - name: APK bauen
        working-directory: android
        run: |
          # 'yes' answers the SDK licence questions; it ends with SIGPIPE, so check the APK instead of the exit code
          yes | buildozer -v android debug 2>&1 | tee build.log || true
          ls -la bin/*.apk

      - name: Fehler als Hinweis zeigen
        if: failure()
        working-directory: android
        run: |
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/::/: :/g' build.log > clean.log
          show() { msg=$(cut -c1-220 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'); echo "::error title=$1::${msg}"; }
          grep -n -A 12 -E "What went wrong|BUILD FAILED|FAILURE:|error:|Error:" clean.log | grep -v "Compiling\|adding:\|copy " | tail -n 45 | show Gradle
          grep -v "^#     " clean.log | tail -n 30 | show Ende

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp android/bin/*.apk "dist/BierAlarm-${GITHUB_REF_NAME#android-v}.apk" 2>/dev/null || cp android/bin/*.apk dist/BierAlarm.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: BierAlarm-apk
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: BierAlarm für Android ${{ github.ref_name }}
          files: dist/*.apk
          # as pre-release, so HACS keeps offering the Home Assistant releases (tags v*)
          prerelease: true
          body: |
            BierAlarm als eigene Android-App, ohne Home Assistant.

            **Installieren:** `BierAlarm-….apk` am Handy herunterladen und öffnen. Android fragt einmal, ob der Browser Apps installieren darf („Unbekannte Apps installieren“).

            - Aktionen von PENNY, Lidl, MPREIS, BILLA, BILLA PLUS, INTERSPAR und HOFER, sortiert nach Preis pro 20er-Kiste
            - Suche und Filter nach Markt
            - Benachrichtigung, wenn eine Lieblingssorte in Aktion ist oder eine Kiste unter dein Limit fällt (beim Öffnen der App, höchstens alle 3 Stunden neu geladen)
